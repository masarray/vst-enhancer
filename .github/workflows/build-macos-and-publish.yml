name: Build macOS and publish cross-platform release
run-name: macOS release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag, for example v0.5.21
        required: true
        type: string
      confirm_publish:
        description: Publish after every Windows and macOS gate passes
        required: true
        default: false
        type: boolean
      repair_published_release:
        description: Explicitly add missing Mac assets to an already-published release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: arsonkupik-public-macos-release
  cancel-in-progress: false

jobs:
  build-macos-and-publish:
    name: Universal macOS build and final publication
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'masarray/vst-enhancer' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'masarray' &&
      inputs.confirm_publish == true
    environment: mac-release
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PUBLIC_REPO: masarray/vst-enhancer
      PRIVATE_REPO: masarray/askp-vst
      APPROVED_WORKFLOW: .github/workflows/build-macos-and-publish.yml

    steps:
      - name: Resolve and verify release boundary
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_REPAIR: ${{ inputs.repair_published_release }}
        run: |
          set -euo pipefail

          workflow_files="$(gh api "repos/$PUBLIC_REPO/git/trees/main?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | startswith(".github/workflows/"))) | .path')"
          workflow_count="$(printf '%s\n' "$workflow_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          [[ "$workflow_count" == 1 && "$workflow_files" == "$APPROVED_WORKFLOW" ]] || {
            echo "The public repository must contain exactly one approved manual workflow." >&2
            exit 1
          }

          tag="$INPUT_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }

          release_json="$(gh release view "$tag" --repo "$PUBLIC_REPO" \
            --json isDraft,isPrerelease,assets)"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          [[ "$is_prerelease" == false ]] || {
            echo "$tag is a prerelease; production repair is forbidden." >&2
            exit 1
          }

          repair=false
          if [[ "$is_draft" != true ]]; then
            [[ "$INPUT_REPAIR" == true ]] || {
              echo "$tag is already published; repair_published_release must be explicitly true." >&2
              exit 1
            }
            repair=true
          fi

          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          for required in \
            "ArSonKuPik-$tag-Windows-x64-Setup.exe" \
            "ArSonKuPik-$tag-Windows-x64-VST3.zip" \
            "ArSonKuPik-$tag-Windows-x64-Standalone.zip" \
            "SHA256SUMS-Windows.txt" \
            "BUILDINFO-Windows.json"
          do
            grep -Fxq "$required" <<<"$assets" || {
              echo "Required audited Windows asset is missing: $required" >&2
              exit 1
            }
          done

          echo "RELEASE_TAG=$tag" >>"$GITHUB_ENV"
          echo "RELEASE_NUMBER=${tag#v}" >>"$GITHUB_ENV"
          echo "RELEASE_REPAIR=$repair" >>"$GITHUB_ENV"
          echo "MAC_DIST=$RUNNER_TEMP/askp-mac-dist" >>"$GITHUB_ENV"

      - name: Checkout reviewed helper and exact proprietary source tag
        env:
          GH_TOKEN: ${{ secrets.ASKP_PRIVATE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "Repository secret ASKP_PRIVATE_SOURCE_TOKEN is missing." >&2
            exit 1
          }
          private="$(gh api "repos/$PRIVATE_REPO" --jq '.private')"
          [[ "$private" == true ]] || {
            echo "The proprietary source repository is not private." >&2
            exit 1
          }

          rm -rf helper source
          gh repo clone "$PRIVATE_REPO" helper -- --branch master --depth 1
          helper_commit="$(git -C helper rev-parse HEAD)"

          gh repo clone "$PRIVATE_REPO" source -- --branch "$RELEASE_TAG" --depth 1
          source_commit="$(git -C source rev-parse HEAD)"
          exact_tag="$(git -C source describe --tags --exact-match)"
          [[ "$exact_tag" == "$RELEASE_TAG" ]] || {
            echo "Private checkout does not match $RELEASE_TAG." >&2
            exit 1
          }

          echo "HELPER_COMMIT=$helper_commit" >>"$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >>"$GITHUB_ENV"

      - name: Verify approved release request and pinned source
        run: |
          set -euo pipefail
          python3 - "$RELEASE_NUMBER" "$SOURCE_COMMIT" "$RELEASE_REPAIR" <<'PY'
          import json
          import pathlib
          import sys

          number, source_commit, repair = sys.argv[1:]
          request = json.loads(
              pathlib.Path("helper/.github/release-request.json").read_text(encoding="utf-8")
          )
          expected = {
              "schemaVersion": 4,
              "requestedVersion": number,
              "sourceCommit": source_commit,
              "approved": True,
              "mode": "local-two-stage-public-binary-release",
              "macBuildProvider": "public-github-actions",
              "publicMacWorkflow": "build-macos-and-publish.yml",
              "sourceVisibility": "private",
              "publicRepository": "masarray/vst-enhancer",
              "juceDistributionConfirmed": True,
              "requireWindowsAssets": True,
              "requireMacAssetsBeforePublish": True,
              "privateRepositoryActionsEnabled": False,
              "publicWorkflowTrigger": "workflow_dispatch-only",
              "publicWorkflowActor": "masarray",
              "publicWorkflowLogsMayContainSource": False,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(
                      f"Release request mismatch: {key}={request.get(key)!r}, expected {value!r}"
                  )
          if repair == "true" and request.get("allowPublishedReleaseRepair") is not True:
              raise SystemExit("Published-release repair is not approved by the private request.")
          if not isinstance(request.get("allowRunnerPortabilityPatches"), bool):
              raise SystemExit("Runner portability-patch policy must be explicit.")
          package = request.get("macPackage", {})
          if package.get("architectures") != ["arm64", "x86_64"]:
              raise SystemExit("macOS architectures must be arm64 + x86_64.")
          if package.get("deploymentTarget") != "11.0":
              raise SystemExit("macOS deployment target must remain 11.0.")
          if (
              package.get("developerIdSigned") is not False
              or package.get("notarized") is not False
              or package.get("adHocSigned") is not True
          ):
              raise SystemExit("macOS signing disclosure is inconsistent.")
          print("[PASS] Release request pins the exact source tag and commit.")
          PY
          allow_patches="$(jq -r '.allowRunnerPortabilityPatches' \
            helper/.github/release-request.json)"
          echo "ALLOW_RUNNER_PORTABILITY_PATCHES=$allow_patches" >>"$GITHUB_ENV"

      - name: Stage canonical legal bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$PUBLIC_REPO" "$GITHUB_SHA" <<'PY'
          import base64
          import json
          from pathlib import Path
          import subprocess
          import sys

          repository, commit = sys.argv[1:3]
          required = {
              "EULA.txt": ("END USER LICENCE AGREEMENT",),
              "PURCHASE_TERMS.txt": ("PURCHASE", "ArSonKuPik"),
              "THIRD_PARTY_NOTICES.txt": (
                  "ARSONKUPIK THIRD-PARTY NOTICES",
                  "ArSonKuPik-MIT.txt",
                  "Steinberg-VST3-SDK-MIT.txt",
                  "Plus-Jakarta-Sans-OFL-1.1.txt",
              ),
              "ArSonKuPik-MIT.txt": ("MIT License", "Copyright (c) 2026 Tutorial Mas Ari"),
              "Steinberg-VST3-SDK-MIT.txt": (
                  "MIT License",
                  "Steinberg Media Technologies GmbH",
              ),
              "Plus-Jakarta-Sans-OFL-1.1.txt": (
                  "SIL OPEN FONT LICENSE Version 1.1",
                  "Copyright 2020 The Plus Jakarta Sans Project Authors",
              ),
          }

          for name, markers in required.items():
              endpoint = f"repos/{repository}/contents/{name}?ref={commit}"
              payload = json.loads(
                  subprocess.check_output(
                      ["gh", "api", endpoint], text=True, encoding="utf-8"
                  )
              )
              if payload.get("type") != "file" or payload.get("encoding") != "base64":
                  raise SystemExit(f"Canonical legal payload is invalid: {name}")
              raw = base64.b64decode(payload["content"], validate=False)
              text = raw.decode("utf-8")
              missing = [marker for marker in markers if marker not in text]
              if len(raw) < 100 or missing:
                  raise SystemExit(f"Canonical legal payload failed validation: {name}")
              Path("source", name).write_bytes(raw)

          print("[PASS] Canonical public legal bundle staged from the workflow commit.")
          PY

      - name: Build, audit and package macOS Universal binaries
        run: |
          set -euo pipefail
          ASKP_RELEASE_REQUEST_PATH="$GITHUB_WORKSPACE/helper/.github/release-request.json" \
          ASKP_RELEASE_HELPER_COMMIT="$HELPER_COMMIT" \
            bash helper/scripts/build-macos-ci.sh "$RELEASE_NUMBER" "$MAC_DIST" source

      - name: Verify macOS provenance and platform checksums
        run: |
          set -euo pipefail
          (
            cd "$MAC_DIST"
            shasum -a 256 -c SHA256SUMS-macOS.txt
          )
          python3 - \
            "$MAC_DIST/BUILDINFO-macOS.json" \
            "$RELEASE_TAG" \
            "$SOURCE_COMMIT" \
            "$HELPER_COMMIT" \
            "$GITHUB_SHA" \
            "$ALLOW_RUNNER_PORTABILITY_PATCHES" <<'PY'
          import json
          import pathlib
          import re
          import sys

          (
              path,
              tag,
              source_commit,
              helper_commit,
              workflow_commit,
              allow_patches,
          ) = sys.argv[1:]
          expected_patch_summary = (
              [
                  "CMakeLists.txt",
                  "src/PluginProcessor.cpp",
                  "tools/crackle_test_main.cpp",
              ]
              if allow_patches == "true"
              else []
          )
          payload = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 4,
              "version": tag,
              "sourceTag": tag,
              "sourceCommit": source_commit,
              "releaseHelperCommit": helper_commit,
              "publicWorkflowCommit": workflow_commit,
              "runnerPatchedSource": allow_patches == "true",
              "runnerPatchSummary": expected_patch_summary,
              "architectures": ["arm64", "x86_64"],
              "deploymentTarget": "11.0",
              "developerIdSigned": False,
              "notarized": False,
              "adHocSigned": True,
              "generatedBy": "GitHub-hosted public macOS runner",
              "proprietarySourceIncluded": False,
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(
                      f"macOS provenance mismatch: {key}={payload.get(key)!r}, expected {value!r}"
                  )
          if not re.fullmatch(r"[0-9a-f]{64}", payload.get("compiledSourceTreeHash", "")):
              raise SystemExit("Compiled-source tree hash is missing or invalid.")
          print("[PASS] macOS build provenance matches the approved source and workflow.")
          PY

      - name: Create combined checksums and final release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --pattern SHA256SUMS-Windows.txt \
            --dir "$MAC_DIST" \
            --clobber
          cat "$MAC_DIST/SHA256SUMS-Windows.txt" "$MAC_DIST/SHA256SUMS-macOS.txt" \
            | LC_ALL=C sort >"$MAC_DIST/SHA256SUMS.txt"
          [[ "$(wc -l <"$MAC_DIST/SHA256SUMS.txt" | tr -d ' ')" == 8 ]] || {
            echo "Combined checksum inventory must contain exactly 8 entries." >&2
            exit 1
          }

          cat >"$MAC_DIST/release-notes-final.md" <<EOF_NOTES
          # ArSonKuPik VST $RELEASE_TAG - Windows and macOS

          ## Release highlights
          - The exact tagged product source passed the version-specific DSP, crackle, realtime, multirate and plugin-parity gates.
          - Windows and macOS packages are binary-only and built through the approved platform-specific release paths.
          - Platform checksums, combined checksums and build provenance are attached to this release.

          ## Windows
          - [Windows 10/11 x64 installer](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-Windows-x64-Setup.exe)
          - [Manual VST3 ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-Windows-x64-VST3.zip)
          - [Standalone ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-Windows-x64-Standalone.zip)
          - Windows packages are not commercially code-signed and may trigger SmartScreen.

          ## macOS
          - [Universal DMG package](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg)
          - [Universal Apple Silicon arm64 + Intel x86_64 VST3 ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip)
          - [Universal Standalone ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip)
          - Ad-hoc signed only; not Developer ID signed and not notarized
          - Gatekeeper may require Control-click > Open or Open Anyway

          ## Evaluation and activation
          - 365-day full-editing evaluation
          - No account, card, subscription, automatic renewal or automatic charge
          - Optional Rp399.000 perpetual activation for one active computer

          ## Integrity and provenance
          - Proprietary source tag: $RELEASE_TAG
          - Proprietary source commit: $SOURCE_COMMIT
          - Reviewed release helper commit: $HELPER_COMMIT
          - When approved, the runner uses only the reviewed three-file Xcode/Clang portability patch; no DSP tuning is patched
          - Public workflow run: https://github.com/$PUBLIC_REPO/actions/runs/$GITHUB_RUN_ID
          - Public packages are binary-only
          - [Verify every download against SHA256SUMS.txt](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/SHA256SUMS.txt)
          EOF_NOTES

      - name: Upload approved macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$MAC_DIST/ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg" \
            "$MAC_DIST/ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip" \
            "$MAC_DIST/ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip" \
            "$MAC_DIST/SHA256SUMS-macOS.txt" \
            "$MAC_DIST/SHA256SUMS.txt" \
            "$MAC_DIST/BUILDINFO-macOS.json" \
            --repo "$PUBLIC_REPO" \
            --clobber

      - name: Update public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf public
          git clone "https://github.com/$PUBLIC_REPO.git" public
          if ! python3 helper/scripts/update-public-crossplatform-release.py \
            --repo public \
            --version "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            >"$RUNNER_TEMP/public-metadata.log" 2>&1
          then
            echo "Public metadata update failed. Detailed private output was withheld." >&2
            exit 1
          fi
          git -C public config user.name "Mas Ari Release Automation"
          git -C public config user.email "258017373+masarray@users.noreply.github.com"
          git -C public add README.md CHANGELOG.md site
          if ! git -C public diff --cached --quiet; then
            git -C public commit -m "Publish ArSonKuPik VST $RELEASE_TAG cross-platform metadata"
            git -C public push origin HEAD:main
          fi
          echo "PUBLIC_METADATA_COMMIT=$(git -C public rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Deploy and verify exact gh-pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page_branch="$(gh api "repos/$PUBLIC_REPO/pages" --jq '.source.branch')"
          page_path="$(gh api "repos/$PUBLIC_REPO/pages" --jq '.source.path')"
          [[ "$page_branch" == gh-pages && "$page_path" == / ]] || {
            echo "GitHub Pages must be configured for gh-pages:/." >&2
            exit 1
          }

          site_copy="$RUNNER_TEMP/askp-site-copy"
          pages_dir="$RUNNER_TEMP/askp-public-pages"
          rm -rf "$site_copy" "$pages_dir"
          cp -R public/site "$site_copy"
          git -C public fetch origin gh-pages
          git -C public worktree add -B release-gh-pages "$pages_dir" origin/gh-pages
          find "$pages_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$site_copy"/. "$pages_dir"/
          touch "$pages_dir/.nojekyll"
          git -C "$pages_dir" config user.name "Mas Ari Release Automation"
          git -C "$pages_dir" config user.email "258017373+masarray@users.noreply.github.com"
          git -C "$pages_dir" add -A
          if ! git -C "$pages_dir" diff --cached --quiet; then
            git -C "$pages_dir" commit -m "Deploy ArSonKuPik $RELEASE_TAG landing"
            git -C "$pages_dir" push origin HEAD:gh-pages
          fi

          pages_commit="$(git -C "$pages_dir" rev-parse HEAD)"
          remote_commit="$(gh api "repos/$PUBLIC_REPO/git/ref/heads/gh-pages" --jq '.object.sha')"
          [[ "$remote_commit" == "$pages_commit" ]] || {
            echo "Remote gh-pages ref does not match the exact staged site commit." >&2
            exit 1
          }
          python3 - "$pages_dir/release.json" "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("version") != sys.argv[2]:
              raise SystemExit("gh-pages release manifest does not match the release tag.")
          if payload.get("platforms") != ["windows-x64", "macos-universal"]:
              raise SystemExit("gh-pages release manifest is not cross-platform.")
          print("[PASS] Exact gh-pages ref and cross-platform manifest verified.")
          PY

      - name: Publish and verify the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --title "ArSonKuPik VST $RELEASE_TAG - Windows and macOS" \
            --notes-file "$MAC_DIST/release-notes-final.md" \
            --draft=false \
            --prerelease=false \
            --latest

          final_state="$(gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" \
            --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
          [[ "$final_state" == $'false\tfalse' ]] || {
            echo "Release did not finish as a published production release." >&2
            exit 1
          }

          expected="$RUNNER_TEMP/expected-assets.txt"
          actual="$RUNNER_TEMP/actual-assets.txt"
          cat >"$expected" <<EOF_ASSETS
          ArSonKuPik-$RELEASE_TAG-Windows-x64-Setup.exe
          ArSonKuPik-$RELEASE_TAG-Windows-x64-Standalone.zip
          ArSonKuPik-$RELEASE_TAG-Windows-x64-VST3.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg
          BUILDINFO-Windows.json
          BUILDINFO-macOS.json
          SHA256SUMS-Windows.txt
          SHA256SUMS-macOS.txt
          SHA256SUMS.txt
          EOF_ASSETS
          LC_ALL=C sort -o "$expected" "$expected"
          gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort >"$actual"
          diff -u "$expected" "$actual"

          invalid_digests="$(gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" \
            --json assets --jq '.assets[] | select((.digest // "") | startswith("sha256:") | not) | .name')"
          [[ -z "$invalid_digests" ]] || {
            echo "One or more release assets lack a GitHub SHA-256 digest." >&2
            printf '%s\n' "$invalid_digests" >&2
            exit 1
          }

          echo "Published: https://github.com/$PUBLIC_REPO/releases/tag/$RELEASE_TAG"
