name: Build macOS and publish cross-platform release
run-name: macOS release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release tag, for example v0.5.23
        required: true
        type: string
      confirm_publish:
        description: Publish after every Windows and macOS gate passes
        required: true
        default: false
        type: boolean
      repair_published_release:
        description: Explicitly add missing Mac assets to an already-published release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arsonkupik-public-macos-release
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build audited source-free macOS handoff
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'masarray/vst-enhancer' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'masarray' &&
      inputs.confirm_publish == true
    environment: mac-release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.boundary.outputs.release_tag }}
      release_number: ${{ steps.boundary.outputs.release_number }}
      release_repair: ${{ steps.boundary.outputs.release_repair }}
      source_commit: ${{ steps.private_inputs.outputs.source_commit }}
      helper_commit: ${{ steps.private_inputs.outputs.helper_commit }}
      allow_patches: ${{ steps.request.outputs.allow_patches }}
    env:
      PUBLIC_REPO: masarray/vst-enhancer
      PRIVATE_REPO: masarray/askp-vst
      APPROVED_WORKFLOW: .github/workflows/build-macos-and-publish.yml
      APPROVED_PAGES_WORKFLOW: .github/workflows/pages.yml

    steps:
      - name: Initialize build paths
        run: |
          set -euo pipefail
          {
            echo "REQUEST_PATH=$RUNNER_TEMP/approved-release-request.json"
            echo "MAC_DIST=$RUNNER_TEMP/askp-mac-dist"
            echo "HANDOFF_DIR=$RUNNER_TEMP/publish-handoff"
          } >>"$GITHUB_ENV"

      - name: Resolve and verify release boundary
        id: boundary
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_REPAIR: ${{ inputs.repair_published_release }}
        run: |
          set -euo pipefail

          workflow_files="$(gh api "repos/$PUBLIC_REPO/git/trees/main?recursive=1" \
            --jq '.tree[] | select(.type == "blob" and (.path | startswith(".github/workflows/"))) | .path' \
            | LC_ALL=C sort)"
          approved_workflows="$(printf '%s\n' \
            "$APPROVED_WORKFLOW" \
            "$APPROVED_PAGES_WORKFLOW" \
            | LC_ALL=C sort)"
          [[ "$workflow_files" == "$approved_workflows" ]] || {
            echo "The public repository workflow allowlist is invalid." >&2
            echo "Expected:" >&2
            printf '%s\n' "$approved_workflows" >&2
            echo "Actual:" >&2
            printf '%s\n' "$workflow_files" >&2
            exit 1
          }

          tag="$INPUT_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }

          release_json="$(gh release view "$tag" --repo "$PUBLIC_REPO" \
            --json isDraft,isPrerelease,assets)"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          [[ "$is_prerelease" == false ]] || {
            echo "$tag is a prerelease; production repair is forbidden." >&2
            exit 1
          }

          repair=false
          if [[ "$is_draft" != true ]]; then
            [[ "$INPUT_REPAIR" == true ]] || {
              echo "$tag is already published; repair_published_release must be explicitly true." >&2
              exit 1
            }
            repair=true
          fi

          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          for required in \
            "ArSonKuPik-$tag-Windows-x64-Setup.exe" \
            "ArSonKuPik-$tag-Windows-x64-VST3.zip" \
            "ArSonKuPik-$tag-Windows-x64-Standalone.zip" \
            "SHA256SUMS-Windows.txt" \
            "BUILDINFO-Windows.json"
          do
            grep -Fxq "$required" <<<"$assets" || {
              echo "Required audited Windows asset is missing: $required" >&2
              exit 1
            }
          done

          number="${tag#v}"
          echo "RELEASE_TAG=$tag" >>"$GITHUB_ENV"
          echo "RELEASE_NUMBER=$number" >>"$GITHUB_ENV"
          echo "RELEASE_REPAIR=$repair" >>"$GITHUB_ENV"
          echo "release_tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release_number=$number" >>"$GITHUB_OUTPUT"
          echo "release_repair=$repair" >>"$GITHUB_OUTPUT"

      - name: Resolve approved helper and exact proprietary source
        id: private_inputs
        env:
          GH_TOKEN: ${{ secrets.ASKP_PRIVATE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "Environment secret ASKP_PRIVATE_SOURCE_TOKEN is missing." >&2
            exit 1
          }

          private="$(gh api "repos/$PRIVATE_REPO" --jq '.private')"
          [[ "$private" == true ]] || {
            echo "The proprietary source repository is not private." >&2
            exit 1
          }
          gh auth setup-git

          rm -rf private helper source "$REQUEST_PATH"
          gh api "repos/$PRIVATE_REPO/contents/.github/release-request.json?ref=master" \
            --jq '.content' | base64 --decode >"$REQUEST_PATH"

          helper_commit="$(jq -er '.helperCommit' "$REQUEST_PATH")"
          requested_source="$(jq -er '.sourceCommit' "$REQUEST_PATH")"
          [[ "$helper_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Approved helper commit is not a full SHA." >&2
            exit 1
          }
          [[ "$requested_source" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Approved source commit is not a full SHA." >&2
            exit 1
          }

          gh repo clone "$PRIVATE_REPO" private -- --no-checkout --filter=blob:none
          git -C private fetch --no-tags --depth 1 origin "$helper_commit"
          git -C private branch p0-approved-helper FETCH_HEAD
          git -C private worktree add --detach "$GITHUB_WORKSPACE/helper" p0-approved-helper

          git -C private fetch --depth 1 origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git -C private worktree add --detach "$GITHUB_WORKSPACE/source" \
            "refs/tags/$RELEASE_TAG"

          actual_helper="$(git -C helper rev-parse HEAD)"
          source_commit="$(git -C source rev-parse HEAD)"
          exact_tag="$(git -C source describe --tags --exact-match)"
          [[ "$actual_helper" == "$helper_commit" ]] || {
            echo "Helper checkout does not match the approved helper commit." >&2
            exit 1
          }
          [[ "$exact_tag" == "$RELEASE_TAG" ]] || {
            echo "Private source checkout does not match $RELEASE_TAG." >&2
            exit 1
          }
          [[ "$source_commit" == "$requested_source" ]] || {
            echo "Private tag commit does not match the approved source commit." >&2
            exit 1
          }

          echo "HELPER_COMMIT=$actual_helper" >>"$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >>"$GITHUB_ENV"
          echo "helper_commit=$actual_helper" >>"$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >>"$GITHUB_OUTPUT"

      - name: Verify approved release request
        id: request
        run: |
          set -euo pipefail
          python3 - \
            "$REQUEST_PATH" \
            "$RELEASE_NUMBER" \
            "$SOURCE_COMMIT" \
            "$HELPER_COMMIT" \
            "$RELEASE_REPAIR" <<'PY'
          import json
          import pathlib
          import sys

          path, number, source_commit, helper_commit, repair = sys.argv[1:]
          request = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 5,
              "requestedVersion": number,
              "sourceCommit": source_commit,
              "helperCommit": helper_commit,
              "approved": True,
              "mode": "local-two-stage-public-binary-release",
              "macBuildProvider": "public-github-actions",
              "publicMacWorkflow": "build-macos-and-publish.yml",
              "sourceVisibility": "private",
              "publicRepository": "masarray/vst-enhancer",
              "juceDistributionConfirmed": True,
              "requireWindowsAssets": True,
              "requireMacAssetsBeforePublish": True,
              "privateRepositoryActionsEnabled": False,
              "publicWorkflowTrigger": "workflow_dispatch-only",
              "publicWorkflowActor": "masarray",
              "publicWorkflowLogsMayContainSource": False,
              "publicBuildJobPermissions": "contents-read",
              "publicPublishJobSourceFree": True,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(
                      f"Release request mismatch: {key}={request.get(key)!r}, "
                      f"expected {value!r}"
                  )
          if repair == "true" and request.get("allowPublishedReleaseRepair") is not True:
              raise SystemExit("Published-release repair is not approved.")
          if not isinstance(request.get("allowRunnerPortabilityPatches"), bool):
              raise SystemExit("Runner portability-patch policy must be explicit.")
          package = request.get("macPackage", {})
          if package.get("architectures") != ["arm64", "x86_64"]:
              raise SystemExit("macOS architectures must be arm64 + x86_64.")
          if package.get("deploymentTarget") != "11.0":
              raise SystemExit("macOS deployment target must remain 11.0.")
          if (
              package.get("developerIdSigned") is not False
              or package.get("notarized") is not False
              or package.get("adHocSigned") is not True
          ):
              raise SystemExit("macOS signing disclosure is inconsistent.")
          print("[PASS] Source and helper commits are independently approved.")
          PY

          allow_patches="$(jq -r '.allowRunnerPortabilityPatches' "$REQUEST_PATH")"
          echo "ALLOW_RUNNER_PORTABILITY_PATCHES=$allow_patches" >>"$GITHUB_ENV"
          echo "allow_patches=$allow_patches" >>"$GITHUB_OUTPUT"

      - name: Stage canonical legal bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$PUBLIC_REPO" "$GITHUB_SHA" <<'PY'
          import base64
          import json
          from pathlib import Path
          import subprocess
          import sys

          repository, commit = sys.argv[1:3]
          required = {
              "EULA.txt": ("END USER LICENCE AGREEMENT",),
              "PURCHASE_TERMS.txt": ("PURCHASE", "ArSonKuPik"),
              "THIRD_PARTY_NOTICES.txt": (
                  "ARSONKUPIK THIRD-PARTY NOTICES",
                  "ArSonKuPik-MIT.txt",
                  "Steinberg-VST3-SDK-MIT.txt",
                  "Plus-Jakarta-Sans-OFL-1.1.txt",
              ),
              "ArSonKuPik-MIT.txt": (
                  "MIT License",
                  "Copyright (c) 2026 Tutorial Mas Ari",
              ),
              "Steinberg-VST3-SDK-MIT.txt": (
                  "MIT License",
                  "Steinberg Media Technologies GmbH",
              ),
              "Plus-Jakarta-Sans-OFL-1.1.txt": (
                  "SIL OPEN FONT LICENSE Version 1.1",
                  "Copyright 2020 The Plus Jakarta Sans Project Authors",
              ),
          }

          for name, markers in required.items():
              endpoint = f"repos/{repository}/contents/{name}?ref={commit}"
              payload = json.loads(
                  subprocess.check_output(
                      ["gh", "api", endpoint], text=True, encoding="utf-8"
                  )
              )
              if payload.get("type") != "file" or payload.get("encoding") != "base64":
                  raise SystemExit(f"Canonical legal payload is invalid: {name}")
              raw = base64.b64decode(payload["content"], validate=False)
              text = raw.decode("utf-8")
              missing = [marker for marker in markers if marker not in text]
              if len(raw) < 100 or missing:
                  raise SystemExit(f"Canonical legal payload failed validation: {name}")
              Path("source", name).write_bytes(raw)

          print("[PASS] Canonical public legal bundle staged.")
          PY

      - name: Build, audit and package macOS Universal binaries
        run: |
          set -euo pipefail
          ASKP_RELEASE_REQUEST_PATH="$REQUEST_PATH" \
          ASKP_RELEASE_HELPER_COMMIT="$HELPER_COMMIT" \
            bash helper/scripts/build-macos-ci.sh \
              "$RELEASE_NUMBER" "$MAC_DIST" source

      - name: Verify macOS provenance and platform checksums
        run: |
          set -euo pipefail
          (
            cd "$MAC_DIST"
            shasum -a 256 -c SHA256SUMS-macOS.txt
          )
          python3 - \
            "$MAC_DIST/BUILDINFO-macOS.json" \
            "$RELEASE_TAG" \
            "$SOURCE_COMMIT" \
            "$HELPER_COMMIT" \
            "$GITHUB_SHA" \
            "$ALLOW_RUNNER_PORTABILITY_PATCHES" <<'PY'
          import json
          import pathlib
          import re
          import sys

          (
              path,
              tag,
              source_commit,
              helper_commit,
              workflow_commit,
              allow_patches,
          ) = sys.argv[1:]
          expected_patch_summary = (
              [
                  "CMakeLists.txt",
                  "src/PluginProcessor.cpp",
                  "tools/crackle_test_main.cpp",
              ]
              if allow_patches == "true"
              else []
          )
          payload = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 4,
              "version": tag,
              "sourceTag": tag,
              "sourceCommit": source_commit,
              "releaseHelperCommit": helper_commit,
              "publicWorkflowCommit": workflow_commit,
              "runnerPatchedSource": allow_patches == "true",
              "runnerPatchSummary": expected_patch_summary,
              "architectures": ["arm64", "x86_64"],
              "deploymentTarget": "11.0",
              "developerIdSigned": False,
              "notarized": False,
              "adHocSigned": True,
              "generatedBy": "GitHub-hosted public macOS runner",
              "proprietarySourceIncluded": False,
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(
                      f"macOS provenance mismatch: {key}={payload.get(key)!r}, "
                      f"expected {value!r}"
                  )
          if not re.fullmatch(
              r"[0-9a-f]{64}", payload.get("compiledSourceTreeHash", "")
          ):
              raise SystemExit("Compiled-source tree hash is missing or invalid.")
          print("[PASS] macOS build provenance matches approved inputs.")
          PY

      - name: Create combined checksums and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --pattern SHA256SUMS-Windows.txt \
            --dir "$MAC_DIST" \
            --clobber
          cat "$MAC_DIST/SHA256SUMS-Windows.txt" \
              "$MAC_DIST/SHA256SUMS-macOS.txt" \
            | LC_ALL=C sort >"$MAC_DIST/SHA256SUMS.txt"
          [[ "$(wc -l <"$MAC_DIST/SHA256SUMS.txt" | tr -d ' ')" == 8 ]] || {
            echo "Combined checksum inventory must contain exactly 8 entries." >&2
            exit 1
          }

          cat >"$MAC_DIST/release-notes-final.md" <<EOF_NOTES
          # ArSonKuPik VST $RELEASE_TAG - Windows and macOS

          ## Release highlights
          - The exact tagged product source passed the version-specific DSP, crackle, realtime, multirate and plugin-parity gates.
          - Windows and macOS packages are binary-only and built through the approved platform-specific release paths.
          - Platform checksums, combined checksums and build provenance are attached to this release.

          ## Windows
          - [Windows 10/11 x64 installer](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-Windows-x64-Setup.exe)
          - [Manual VST3 ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-Windows-x64-VST3.zip)
          - [Standalone ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-Windows-x64-Standalone.zip)
          - Windows packages are not commercially code-signed and may trigger SmartScreen.

          ## macOS
          - [Universal DMG package](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg)
          - [Universal Apple Silicon arm64 + Intel x86_64 VST3 ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip)
          - [Universal Standalone ZIP](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip)
          - Ad-hoc signed only; not Developer ID signed and not notarized
          - Gatekeeper may require Control-click > Open or Open Anyway

          ## Evaluation and activation
          - 365-day full-editing evaluation
          - No account, card, subscription, automatic renewal or automatic charge
          - Optional Rp399.000 perpetual activation for one active computer

          ## Integrity and provenance
          - Proprietary source tag: $RELEASE_TAG
          - Proprietary source commit: $SOURCE_COMMIT
          - Reviewed release helper commit: $HELPER_COMMIT
          - The build job had read-only public-repository permission.
          - The publish job receives only the verified source-free handoff.
          - Public workflow run: https://github.com/$PUBLIC_REPO/actions/runs/$GITHUB_RUN_ID
          - Public packages are binary-only
          - [Verify every download against SHA256SUMS.txt](https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/SHA256SUMS.txt)
          EOF_NOTES

      - name: Create and verify source-free publish handoff
        run: |
          set -euo pipefail
          rm -rf "$HANDOFF_DIR"
          mkdir -p "$HANDOFF_DIR"

          expected="$RUNNER_TEMP/expected-handoff-files.txt"
          cat >"$expected" <<EOF_EXPECTED
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg
          BUILDINFO-macOS.json
          SHA256SUMS-macOS.txt
          SHA256SUMS.txt
          release-notes-final.md
          EOF_EXPECTED
          sed -i '' 's/^          //' "$expected"

          while IFS= read -r name; do
            [[ -f "$MAC_DIST/$name" ]] || {
              echo "Missing publish handoff file: $name" >&2
              exit 1
            }
            cp "$MAC_DIST/$name" "$HANDOFF_DIR/$name"
          done <"$expected"

          actual="$RUNNER_TEMP/actual-handoff-files.txt"
          find "$HANDOFF_DIR" -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort >"$actual"
          LC_ALL=C sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"

          if find "$HANDOFF_DIR" -type f | grep -Eiq \
            '\.(c|cc|cpp|cxx|h|hh|hpp|inl|inc|ipp|tpp|m|mm|swift|metal|s|asm|o|obj|a|lib|bc|pdb|map)$'; then
            echo "Source or development material entered the publish handoff." >&2
            exit 1
          fi

          (
            cd "$HANDOFF_DIR"
            find . -maxdepth 1 -type f ! -name HANDOFF-SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 shasum -a 256 \
              >HANDOFF-SHA256SUMS.txt
            shasum -a 256 -c HANDOFF-SHA256SUMS.txt
          )

          rm -rf helper source private "$REQUEST_PATH" "$MAC_DIST"
          [[ ! -e helper && ! -e source && ! -e private ]] || {
            echo "Private checkout cleanup failed." >&2
            exit 1
          }
          [[ ! -e "$REQUEST_PATH" && ! -e "$MAC_DIST" ]] || {
            echo "Private metadata or build workspace cleanup failed." >&2
            exit 1
          }

      - name: Upload verified source-free handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: askp-macos-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-handoff
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish-release:
    name: Publish verified binary-only release
    needs: build-macos
    if: needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    env:
      PUBLIC_REPO: masarray/vst-enhancer
      PAGES_WORKFLOW: pages.yml
      RELEASE_TAG: ${{ needs.build-macos.outputs.release_tag }}
      RELEASE_NUMBER: ${{ needs.build-macos.outputs.release_number }}
      RELEASE_REPAIR: ${{ needs.build-macos.outputs.release_repair }}
      SOURCE_COMMIT: ${{ needs.build-macos.outputs.source_commit }}
      HELPER_COMMIT: ${{ needs.build-macos.outputs.helper_commit }}

    steps:
      - name: Initialize publish path
        run: |
          set -euo pipefail
          echo "MAC_DIST=$RUNNER_TEMP/publish-handoff" >>"$GITHUB_ENV"

      - name: Download source-free handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: askp-macos-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-handoff

      - name: Verify handoff integrity and boundary
        run: |
          set -euo pipefail
          [[ -d "$MAC_DIST" ]] || {
            echo "Publish handoff directory is missing." >&2
            exit 1
          }

          (
            cd "$MAC_DIST"
            shasum -a 256 -c HANDOFF-SHA256SUMS.txt
          )

          expected="$RUNNER_TEMP/expected-publish-files.txt"
          cat >"$expected" <<EOF_EXPECTED
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg
          BUILDINFO-macOS.json
          HANDOFF-SHA256SUMS.txt
          SHA256SUMS-macOS.txt
          SHA256SUMS.txt
          release-notes-final.md
          EOF_EXPECTED
          sed -i 's/^          //' "$expected"
          LC_ALL=C sort -o "$expected" "$expected"

          actual="$RUNNER_TEMP/actual-publish-files.txt"
          find "$MAC_DIST" -maxdepth 1 -type f -exec basename {} \; \
            | LC_ALL=C sort >"$actual"
          diff -u "$expected" "$actual"

          if find "$MAC_DIST" -type f | grep -Eiq \
            '\.(c|cc|cpp|cxx|h|hh|hpp|inl|inc|ipp|tpp|m|mm|swift|metal|s|asm|o|obj|a|lib|bc|pdb|map)$'; then
            echo "Publish job received source or development material." >&2
            exit 1
          fi

          for prohibited in helper source private askp-vst engine src tools .github; do
            if find "$MAC_DIST" -type d -name "$prohibited" -print -quit | grep -q .; then
              echo "Publish job received prohibited directory: $prohibited" >&2
              exit 1
            fi
          done

      - name: Upload approved macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$MAC_DIST/ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg" \
            "$MAC_DIST/ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip" \
            "$MAC_DIST/ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip" \
            "$MAC_DIST/SHA256SUMS-macOS.txt" \
            "$MAC_DIST/SHA256SUMS.txt" \
            "$MAC_DIST/BUILDINFO-macOS.json" \
            --repo "$PUBLIC_REPO" \
            --clobber

      - name: Update public metadata from public tooling
        id: public_metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf public
          git clone "https://github.com/$PUBLIC_REPO.git" public

          updater="public/tools/update-public-crossplatform-release.py"
          [[ -f "$updater" ]] || {
            echo "Public metadata updater is missing." >&2
            exit 1
          }
          if ! python3 "$updater" \
            --repo public \
            --version "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            >"$RUNNER_TEMP/public-metadata.log" 2>&1
          then
            echo "Public metadata update failed." >&2
            cat "$RUNNER_TEMP/public-metadata.log" >&2
            exit 1
          fi

          python3 public/tools/refresh-sitemap-lastmod.py --date "$(date -u +%F)"
          python3 public/tools/validate-seo.py
          git -C public config user.name "Mas Ari Release Automation"
          git -C public config user.email "258017373+masarray@users.noreply.github.com"
          git -C public add README.md CHANGELOG.md site
          if ! git -C public diff --cached --quiet; then
            git -C public commit \
              -m "Publish ArSonKuPik VST $RELEASE_TAG cross-platform metadata"
            git -C public push origin HEAD:main
          fi

          metadata_commit="$(git -C public rev-parse HEAD)"
          [[ "$metadata_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Public metadata commit is invalid." >&2
            exit 1
          }
          echo "PUBLIC_METADATA_COMMIT=$metadata_commit" >>"$GITHUB_ENV"
          echo "commit=$metadata_commit" >>"$GITHUB_OUTPUT"

      - name: Dispatch and verify exact Pages workflow source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$PUBLIC_METADATA_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "PUBLIC_METADATA_COMMIT is not an exact commit SHA." >&2
            exit 1
          }

          build_type="$(gh api "repos/$PUBLIC_REPO/pages" --jq '.build_type')"
          [[ "$build_type" == workflow ]] || {
            echo "GitHub Pages must use GitHub Actions workflow deployment." >&2
            exit 1
          }

          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$PAGES_WORKFLOW" \
            --repo "$PUBLIC_REPO" \
            --ref main \
            -f site_ref="$PUBLIC_METADATA_COMMIT" \
            -f expected_version="$RELEASE_TAG"

          pages_run_id=""
          for _ in $(seq 1 60); do
            runs="$(gh run list \
              --repo "$PUBLIC_REPO" \
              --workflow "$PAGES_WORKFLOW" \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha,status,conclusion,createdAt,url)"
            pages_run_id="$(jq -r \
              --arg sha "$PUBLIC_METADATA_COMMIT" \
              --arg started "$dispatch_started" \
              '[.[] | select(.headSha == $sha and .createdAt >= $started)]
               | sort_by(.createdAt)
               | last
               | .databaseId // empty' <<<"$runs")"
            [[ -n "$pages_run_id" ]] && break
            sleep 5
          done
          [[ -n "$pages_run_id" ]] || {
            echo "The exact Pages workflow run did not appear." >&2
            exit 1
          }

          pages_status=""
          pages_conclusion=""
          pages_head_sha=""
          pages_url=""
          for _ in $(seq 1 120); do
            run_json="$(gh run view "$pages_run_id" \
              --repo "$PUBLIC_REPO" \
              --json status,conclusion,headSha,url)"
            pages_status="$(jq -r '.status' <<<"$run_json")"
            pages_conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            pages_head_sha="$(jq -r '.headSha' <<<"$run_json")"
            pages_url="$(jq -r '.url' <<<"$run_json")"
            [[ "$pages_status" == completed ]] && break
            sleep 5
          done

          [[ "$pages_status" == completed ]] || {
            echo "Pages workflow did not complete before timeout: $pages_url" >&2
            exit 1
          }
          [[ "$pages_head_sha" == "$PUBLIC_METADATA_COMMIT" ]] || {
            echo "Pages workflow head SHA does not match public metadata." >&2
            exit 1
          }
          [[ "$pages_conclusion" == success ]] || {
            echo "Pages workflow failed: $pages_url" >&2
            exit 1
          }

          python3 public/tools/validate-live-seo.py \
            --expected-version "$RELEASE_TAG"
          echo "Verified Pages workflow: $pages_url"

      - name: Publish and verify the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --title "ArSonKuPik VST $RELEASE_TAG - Windows and macOS" \
            --notes-file "$MAC_DIST/release-notes-final.md" \
            --draft=false \
            --prerelease=false \
            --latest

          final_state="$(gh release view "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft,.isPrerelease] | @tsv')"
          [[ "$final_state" == $'false\tfalse' ]] || {
            echo "Release did not finish as a published production release." >&2
            exit 1
          }

          expected="$RUNNER_TEMP/expected-assets.txt"
          actual="$RUNNER_TEMP/actual-assets.txt"
          cat >"$expected" <<EOF_ASSETS
          ArSonKuPik-$RELEASE_TAG-Windows-x64-Setup.exe
          ArSonKuPik-$RELEASE_TAG-Windows-x64-Standalone.zip
          ArSonKuPik-$RELEASE_TAG-Windows-x64-VST3.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-Standalone.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal-VST3.zip
          ArSonKuPik-$RELEASE_TAG-macOS-Universal.dmg
          BUILDINFO-Windows.json
          BUILDINFO-macOS.json
          SHA256SUMS-Windows.txt
          SHA256SUMS-macOS.txt
          SHA256SUMS.txt
          EOF_ASSETS
          sed -i 's/^          //' "$expected"
          LC_ALL=C sort -o "$expected" "$expected"
          gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" \
            --json assets --jq '.assets[].name' \
            | LC_ALL=C sort >"$actual"
          diff -u "$expected" "$actual"

          invalid_digests="$(gh release view "$RELEASE_TAG" \
            --repo "$PUBLIC_REPO" \
            --json assets \
            --jq '.assets[] | select((.digest // "") | startswith("sha256:") | not) | .name')"
          [[ -z "$invalid_digests" ]] || {
            echo "One or more release assets lack a GitHub SHA-256 digest." >&2
            printf '%s\n' "$invalid_digests" >&2
            exit 1
          }

          echo "Published: https://github.com/$PUBLIC_REPO/releases/tag/$RELEASE_TAG"
