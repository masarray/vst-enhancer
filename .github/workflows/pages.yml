name: Deploy GitHub Pages
run-name: Pages ${{ github.event_name == 'pull_request' && format('PR-{0}', github.event.pull_request.number) || github.sha }}

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/render-deployment-seo.py"
      - "tools/validate-seo.py"
      - "tools/validate-live-seo.py"
      - "tools/validate-global-discovery-p1.py"
      - "tools/validate-p0-release-boundary.py"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/render-deployment-seo.py"
      - "tools/validate-seo.py"
      - "tools/validate-live-seo.py"
      - "tools/validate-global-discovery-p1.py"
      - "tools/validate-p0-release-boundary.py"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      site_ref:
        description: Exact main commit containing the audited site
        required: false
        type: string
      expected_version:
        description: Expected version in site/release.json
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arsonkupik-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Pages and release boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.contract.outputs.commit }}
      version: ${{ steps.contract.outputs.version }}

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.site_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate workflow, static-site and indexing contracts
        id: contract
        env:
          REQUESTED_SITE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.site_ref || '' }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '' }}
        run: |
          set -euo pipefail

          actual_commit="$(git rev-parse HEAD)"
          if [[ -n "$REQUESTED_SITE_REF" ]]; then
            [[ "$REQUESTED_SITE_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "site_ref must be an exact 40-character commit SHA." >&2
              exit 1
            }
            [[ "$actual_commit" == "$REQUESTED_SITE_REF" ]] || {
              echo "Checked-out Pages source does not match site_ref." >&2
              exit 1
            }
          fi

          for required in \
            site/.nojekyll \
            site/_headers \
            site/index.html \
            site/robots.txt \
            site/sitemap.xml \
            site/sitemap.txt \
            site/sitemap-discovery.xml \
            site/sitemap-discovery.txt \
            site/release.json \
            tools/render-deployment-seo.py \
            tools/validate-global-discovery-p1.py
          do
            [[ -f "$required" ]] || {
              echo "Required Pages file is missing: $required" >&2
              exit 1
            }
          done

          if find site -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in the Pages artifact." >&2
            exit 1
          fi

          python3 tools/validate-p0-release-boundary.py
          python3 tools/validate-seo.py
          python3 tools/validate-global-discovery-p1.py

          version="$(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("site/release.json").read_text(encoding="utf-8")
          )
          version = payload.get("version")
          if not isinstance(version, str) or not version:
              raise SystemExit("site/release.json has no valid version.")
          print(version)
          PY
          )"

          if [[ -n "$EXPECTED_VERSION" && "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Pages version $version does not match $EXPECTED_VERSION." >&2
            exit 1
          fi

          echo "commit=$actual_commit" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Render and validate canonical deployment artifact
        env:
          EXPECTED_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/arsonkupik-rendered-site"
          rm -rf "$rendered"
          cp -a site "$rendered"
          python3 tools/render-deployment-seo.py --site-dir "$rendered"
          python3 tools/validate-live-seo.py \
            --static-dir "$rendered" \
            --expected-version "$EXPECTED_VERSION"

  promote-source:
    name: Promote Cloudflare canonical source
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.repository == 'masarray/vst-enhancer' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out validated main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 1

      - name: Promote source SEO identity to Cloudflare
        run: |
          set -euo pipefail
          python3 tools/render-deployment-seo.py --site-dir site
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate-seo.py")
          text = path.read_text(encoding="utf-8")
          old = 'ROOT = "https://masarray.github.io/vst-enhancer/"'
          new = 'ROOT = "https://arsonkupik.pages.dev/"'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          elif new not in text:
              raise SystemExit("validate-seo.py has an unexpected canonical ROOT")
          PY
          python3 tools/validate-seo.py
          python3 tools/validate-global-discovery-p1.py

      - name: Persist canonical source when migration is needed
        run: |
          set -euo pipefail
          if git diff --quiet -- site tools/validate-seo.py; then
            echo "Canonical source is already promoted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site tools/validate-seo.py
          git commit -m "Promote Cloudflare canonical SEO source"
          git push origin HEAD:main

  deploy:
    name: Deploy audited GitHub mirror
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'masarray/vst-enhancer' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out validated site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          fetch-depth: 1

      - name: Render GitHub mirror with Cloudflare canonical authority
        run: |
          set -euo pipefail
          python3 tools/render-deployment-seo.py --site-dir site
          python3 tools/validate-global-discovery-p1.py
          python3 tools/validate-live-seo.py \
            --static-dir site \
            --expected-version "${{ needs.validate.outputs.version }}"
          # _headers is a Cloudflare-only build artifact. GitHub Pages does not
          # need to expose it; HTML and discovery files already cross-canonicalize.
          rm -f site/_headers

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload audited Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify Cloudflare primary and GitHub mirror
        run: |
          set -euo pipefail
          python3 tools/validate-live-seo.py \
            --expected-version "${{ needs.validate.outputs.version }}" \
            --attempts 36 \
            --delay-seconds 10
