name: Migrate GitHub Pages to Actions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arsonkupik-pages-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Patch and commit Pages migration
    if: >-
      github.repository == 'masarray/vst-enhancer' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'masarray'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Patch the single approved workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/build-macos-and-publish.yml")
          text = path.read_text(encoding="utf-8")

          expression_open = "$" + "{" + "{"
          expression_close = "}" + "}"

          def expression(body: str) -> str:
              return expression_open + " " + body + " " + expression_close

          old_header = (
              "name: Build macOS and publish cross-platform release\n"
              "run-name: macOS release "
              + expression("inputs.release_tag")
              + "\n\non:\n  workflow_dispatch:\n"
          )
          new_header = """name: Build macOS and publish cross-platform release
          run-name: @@RUN_NAME@@

          on:
            push:
              branches:
                - main
              paths:
                - "site/**"
                - "tools/validate-seo.py"
                - "tools/validate-live-seo.py"
                - ".github/workflows/build-macos-and-publish.yml"
            workflow_dispatch:
          """.replace(
              "@@RUN_NAME@@",
              expression(
                  "github.event_name == 'workflow_dispatch' && "
                  "format('macOS release {0}', inputs.release_tag) || "
                  "'Deploy GitHub Pages'"
              ),
          )

          old_publish_header = """    permissions:
                actions: read
                contents: write
              env:
          """
          new_publish_header = """    permissions:
                actions: read
                contents: write
              outputs:
                public_metadata_commit: @@METADATA_OUTPUT@@
              env:
          """.replace(
              "@@METADATA_OUTPUT@@",
              expression("steps.public_metadata.outputs.commit"),
          )

          old_metadata_step = """      - name: Update public metadata from public tooling
                  env:
          """
          new_metadata_step = """      - name: Update public metadata from public tooling
                  id: public_metadata
                  env:
          """

          old_metadata_tail = """          echo "PUBLIC_METADATA_COMMIT=$(git -C public rev-parse HEAD)" \\
                      >>"$GITHUB_ENV"

          """
          new_metadata_tail = """          metadata_commit="$(git -C public rev-parse HEAD)"
                    echo "PUBLIC_METADATA_COMMIT=$metadata_commit" >>"$GITHUB_ENV"
                    echo "commit=$metadata_commit" >>"$GITHUB_OUTPUT"

          """

          replacements = (
              (old_header, new_header, "event header"),
              (old_publish_header, new_publish_header, "publish outputs"),
              (old_metadata_step, new_metadata_step, "metadata step id"),
              (old_metadata_tail, new_metadata_tail, "metadata output"),
          )
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected {label} boundary.")
              text = text.replace(old, new)

          start_marker = "      - name: Deploy and verify exact gh-pages source"
          end_marker = "      - name: Publish and verify the complete release"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Unexpected legacy Pages deployment boundary.")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = """      - name: Verify staged Pages source
                  run: |
                    set -euo pipefail
                    python3 - "public/site/release.json" "$RELEASE_TAG" <<'PY'
                    import json
                    import pathlib
                    import sys

                    payload = json.loads(
                        pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
                    )
                    if payload.get("version") != sys.argv[2]:
                        raise SystemExit(
                            "main/site release manifest does not match the release tag."
                        )
                    if payload.get("platforms") != [
                        "windows-x64",
                        "macos-universal",
                    ]:
                        raise SystemExit(
                            "main/site release manifest is not cross-platform."
                        )
                    print("[PASS] Audited main/site release manifest verified.")
                    PY

          """
          text = text[:start] + replacement + text[end:]

          if "\n  deploy-pages:\n" in text:
              raise SystemExit("Pages deployment job already exists.")

          deploy_job = r"""

            deploy-pages:
              name: Deploy audited static site to GitHub Pages
              needs:
                - build-macos
                - publish-release
              if: >-
                always() &&
                github.repository == 'masarray/vst-enhancer' &&
                github.ref == 'refs/heads/main' &&
                (
                  github.event_name == 'push' ||
                  (
                    github.event_name == 'workflow_dispatch' &&
                    needs.publish-release.result == 'success'
                  )
                )
              runs-on: ubuntu-latest
              timeout-minutes: 15
              permissions:
                contents: read
                pages: write
                id-token: write
              environment:
                name: github-pages
                url: @@DEPLOYMENT_URL@@

              steps:
                - name: Check out exact audited site source
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    ref: @@SITE_REF@@
                    persist-credentials: false
                    fetch-depth: 1

                - name: Validate static site and release manifest
                  id: site
                  env:
                    EXPECTED_RELEASE_TAG: @@EXPECTED_TAG@@
                  run: |
                    set -euo pipefail

                    for required in \
                      site/.nojekyll \
                      site/index.html \
                      site/robots.txt \
                      site/sitemap.xml \
                      site/sitemap.txt \
                      site/release.json
                    do
                      [[ -f "$required" ]] || {
                        echo "Required Pages file is missing: $required" >&2
                        exit 1
                      }
                    done

                    if find site -type l -print -quit | grep -q .; then
                      echo "Symlinks are not allowed in the Pages artifact." >&2
                      exit 1
                    fi

                    python3 tools/validate-seo.py

                    version="$(python3 - <<'PY'
                    import json
                    from pathlib import Path

                    payload = json.loads(
                        Path("site/release.json").read_text(encoding="utf-8")
                    )
                    version = payload.get("version")
                    if not isinstance(version, str) or not version:
                        raise SystemExit("site/release.json has no valid version.")
                    print(version)
                    PY
                    )"

                    if [[ -n "$EXPECTED_RELEASE_TAG" && "$version" != "$EXPECTED_RELEASE_TAG" ]]; then
                      echo "Pages version $version does not match $EXPECTED_RELEASE_TAG." >&2
                      exit 1
                    fi

                    echo "version=$version" >>"$GITHUB_OUTPUT"

                - name: Configure GitHub Pages
                  uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

                - name: Upload audited Pages artifact
                  uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
                  with:
                    path: ./site
                    include-hidden-files: true

                - name: Deploy GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

                - name: Verify live indexing and release contract
                  run: |
                    set -euo pipefail
                    python3 tools/validate-live-seo.py \
                      --expected-version "@@SITE_VERSION@@"
          """
          deploy_job = deploy_job.replace(
              "@@DEPLOYMENT_URL@@",
              expression("steps.deployment.outputs.page_url"),
          ).replace(
              "@@SITE_REF@@",
              expression(
                  "github.event_name == 'workflow_dispatch' && "
                  "needs.publish-release.outputs.public_metadata_commit || "
                  "github.sha"
              ),
          ).replace(
              "@@EXPECTED_TAG@@",
              expression(
                  "github.event_name == 'workflow_dispatch' && "
                  "needs.build-macos.outputs.release_tag || ''"
              ),
          ).replace(
              "@@SITE_VERSION@@",
              expression("steps.site.outputs.version"),
          )

          text = text.rstrip() + deploy_job.rstrip() + "\n"
          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          text = Path(
              ".github/workflows/build-macos-and-publish.yml"
          ).read_text(encoding="utf-8")
          required = (
              "push:",
              "  deploy-pages:\n",
              "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d",
              "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9",
              "actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128",
              "public_metadata_commit:",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Missing migration marker: {marker}")
          if text.count("  deploy-pages:\n") != 1:
              raise SystemExit("Pages deployment job count is invalid.")
          if "Deploy and verify exact gh-pages source" in text:
              raise SystemExit("Legacy gh-pages deployment still exists.")
          if "@@" in text:
              raise SystemExit("An unresolved migration placeholder remains.")
          print("[PASS] Pages workflow migration patch is structurally complete.")
          PY

          python3 tools/validate-seo.py
          git diff --check

      - name: Commit migration and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name "Mas Ari Pages Migration"
          git config user.email "258017373+masarray@users.noreply.github.com"
          rm ".github/workflows/migrate-pages-bootstrap.yml"
          git add ".github/workflows/build-macos-and-publish.yml" \
            ".github/workflows/migrate-pages-bootstrap.yml"
          git commit -m "Migrate GitHub Pages to audited Actions deployment"
          git push origin HEAD:main
